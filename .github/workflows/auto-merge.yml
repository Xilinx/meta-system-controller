# =============================================================================
# Auto-Merge Trigger Workflow
# =============================================================================
# This lightweight workflow triggers on review/check events and calls the
# centralized SC auto-merge workflow from sc-scripts repository.
#
# Required Secrets (set in your repo or org, inherited automatically):
#   - AUTO_MERGE_TOKEN: PAT from a ssw_builds_team member (bypass actor)
#
# Required Variables (set in your repo settings > Secrets and variables > Variables):
#   - sc_ci_workflow_branches: Comma-separated list of branches to run CI on
# =============================================================================

name: Auto-Merge on Approval

on:
  # Triggers when someone submits a review (approve/reject)
  pull_request_review:
    types: [submitted]

  # Triggers when CI checks complete
  check_suite:
    types: [completed]

  # Triggers when PR CI workflow completes (reliable re-trigger after CI)
  workflow_run:
    workflows: ["PR CI"]
    types: [completed]

# Grant GITHUB_TOKEN write permissions for merge and comments
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Call Centralized SC Auto-Merge Workflow
  # ---------------------------------------------------------------------------
  auto-merge:
    name: SC Auto-Merge
    if: >
      github.event.pull_request != null ||
      github.event.check_suite != null ||
      github.event.workflow_run != null
    uses: AMD-AECG-SSW-PUBLIC/sc-scripts/.github/workflows/sc_auto_merge.yml@master
    with:
      event_name: ${{ github.event_name }}
      # required_approvals: 1          # Optional: override defaults
      # required_team: 'sc_reviewers'  # Optional: override defaults
      # merge_method: 'squash'         # Optional: squash, merge, or rebase
    secrets: inherit
