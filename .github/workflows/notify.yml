# =============================================================================
# Notify on PR Created or Direct Push to Protected Branches
# =============================================================================
#
# Sends notifications when:
#   1. A new PR is created (or reopened) targeting protected branches
#   2. Someone pushes directly to protected branches (bypass actors)
#
# Notification methods (enable the ones you use):
#   - GitHub: @mention teams in a PR/commit comment
#   - Email: via GitHub notification settings (automatic with @mention)
#   - Microsoft Teams: via webhook
#   - Slack: via webhook
#
# =============================================================================

name: Notify on PR & Push

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

  push:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ===========================================================================
  # Notify on new PR
  # ===========================================================================
  notify-pr:
    if: |
      github.event_name == 'pull_request' &&
      vars.sc_ci_workflow_branches != '' &&
      contains(format(',{0},', vars.sc_ci_workflow_branches), format(',{0},', github.event.pull_request.base.ref))
    runs-on: self-hosted
    steps:
      - name: Log PR info
        run: |
          echo "New PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Target: ${{ github.event.pull_request.base.ref }}"

      # ─────────────────────────────────────────────────────────────
      # Microsoft Teams Notification
      # ─────────────────────────────────────────────────────────────
      # Setup: Create an Incoming Webhook in your Teams channel
      #   Teams → Channel → Connectors → Incoming Webhook → Create
      #   Copy the webhook URL
      #   Add as repo secret: TEAMS_WEBHOOK_URL
      # ─────────────────────────────────────────────────────────────
      - name: Notify Microsoft Teams
        continue-on-error: true
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
        if: env.TEAMS_WEBHOOK != ''
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          TARGET="${{ github.event.pull_request.base.ref }}"

          curl -s -X POST "${TEAMS_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{
              \"@type\": \"MessageCard\",
              \"summary\": \"New PR: ${PR_TITLE}\",
              \"themeColor\": \"0076D7\",
              \"title\": \"📢 New Pull Request\",
              \"sections\": [{
                \"facts\": [
                  { \"name\": \"Title\", \"value\": \"${PR_TITLE}\" },
                  { \"name\": \"Author\", \"value\": \"${PR_AUTHOR}\" },
                  { \"name\": \"Target Branch\", \"value\": \"${TARGET}\" },
                  { \"name\": \"Notify\", \"value\": \"cbhanupr_amdeng\" }
                ]
              }],
              \"potentialAction\": [{
                \"@type\": \"OpenUri\",
                \"name\": \"View PR\",
                \"targets\": [{ \"os\": \"default\", \"uri\": \"${PR_URL}\" }]
              }]
            }"

      # ─────────────────────────────────────────────────────────────
      # OPTION: Slack Notification (uncomment to enable)
      # ─────────────────────────────────────────────────────────────
      # Setup: Create a Slack Incoming Webhook
      #   https://api.slack.com/messaging/webhooks
      #   Add as repo secret: SLACK_WEBHOOK_URL
      # ─────────────────────────────────────────────────────────────
      # - name: Notify Slack
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
      #   run: |
      #     PR_URL="${{ github.event.pull_request.html_url }}"
      #     PR_TITLE="${{ github.event.pull_request.title }}"
      #     PR_AUTHOR="${{ github.event.pull_request.user.login }}"
      #     TARGET="${{ github.event.pull_request.base.ref }}"
      #
      #     curl -s -X POST "${SLACK_WEBHOOK}" \
      #       -H "Content-Type: application/json" \
      #       -d "{
      #         \"text\": \"📢 *New PR* on \`${TARGET}\`\n*${PR_TITLE}*\nBy: ${PR_AUTHOR}\n<${PR_URL}|View PR>\"
      #       }"

      # ─────────────────────────────────────────────────────────────
      # Email Notification (using sendmail on self-hosted runner)
      # ─────────────────────────────────────────────────────────────
      - name: Send Email
        continue-on-error: true
        run: |
          SUBJECT="New PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          TO="cbhanupr@amd.com"
          FROM="github-actions@amd.com"
          BODY="New Pull Request on ${{ github.event.pull_request.base.ref }}
          Title: ${{ github.event.pull_request.title }}
          Author: ${{ github.event.pull_request.user.login }}
          URL: ${{ github.event.pull_request.html_url }}"

          if command -v sendmail &>/dev/null; then
            printf "From: %s\nTo: %s\nSubject: %s\nContent-Type: text/plain\n\n%s" \
              "$FROM" "$TO" "$SUBJECT" "$BODY" | sendmail -t
            echo "✅ Email sent via sendmail"
          elif command -v mailx &>/dev/null; then
            echo "$BODY" | mailx -s "$SUBJECT" -r "$FROM" "$TO"
            echo "✅ Email sent via mailx"
          elif command -v mail &>/dev/null; then
            echo "$BODY" | mail -s "$SUBJECT" -r "$FROM" "$TO"
            echo "✅ Email sent via mail"
          else
            echo "⚠️ No mail command available on runner — skipping email"
          fi

  # ===========================================================================
  # Notify on direct push to protected branch
  # ===========================================================================
  notify-push:
    if: |
      github.event_name == 'push' &&
      vars.sc_ci_workflow_branches != '' &&
      contains(format(',{0},', vars.sc_ci_workflow_branches), format(',{0},', github.ref_name))
    runs-on: self-hosted
    steps:
      - name: Notify team about direct push
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const pusher = context.actor;
            const sha = context.sha.substring(0, 8);
            const compareUrl = context.payload.compare;
            const commits = context.payload.commits || [];

            // ─────────────────────────────────────────────
            // CONFIGURE: Teams/people to notify on direct push
            // ─────────────────────────────────────────────
            // const NOTIFY_TEAM = '@AMD-AECG-SSW/ssw_devops';
            const NOTIFY_PEOPLE = '@cbhanupr_amdeng';

            // Build commit list
            let commitList = '';
            for (const commit of commits.slice(0, 10)) {
              const shortSha = commit.id.substring(0, 8);
              commitList += `- [\`${shortSha}\`](${commit.url}) ${commit.message.split('\n')[0]}\n`;
            }
            if (commits.length > 10) {
              commitList += `- ... and ${commits.length - 10} more commits\n`;
            }

            const body = `### ⚠️ Direct Push to Protected Branch\n\n` +
              `${NOTIFY_PEOPLE}\n\n` +
              `| Field | Details |\n` +
              `|---|---|\n` +
              `| **Pushed by** | @${pusher} |\n` +
              `| **Branch** | \`${branch}\` |\n` +
              `| **Commits** | ${commits.length} |\n` +
              `| **Compare** | [View changes](${compareUrl}) |\n\n` +
              `#### Commits\n${commitList}\n` +
              `> ⚠️ This was a direct push, not through a PR. ` +
              `Only bypass actors (ssw_builds_team) can do this.`;

            // Create an issue to track the direct push
            // (since there's no PR to comment on)
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Direct push to ${branch} by ${pusher}`,
              body,
              labels: ['direct-push', 'needs-review']
            });

            core.info(`Created notification issue for direct push to ${branch}`);

      # ─────────────────────────────────────────────────────────────
      # Microsoft Teams notification for direct push
      # ─────────────────────────────────────────────────────────────
      - name: Notify Teams about direct push
        continue-on-error: true
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
        if: env.TEAMS_WEBHOOK != ''
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          PUSHER="${{ github.actor }}"
          COMPARE="${{ github.event.compare }}"

          curl -s -X POST "${TEAMS_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{
              \"@type\": \"MessageCard\",
              \"summary\": \"Direct push to ${BRANCH}\",
              \"themeColor\": \"FF0000\",
              \"title\": \"⚠️ Direct Push to Protected Branch\",
              \"sections\": [{
                \"facts\": [
                  { \"name\": \"Pushed by\", \"value\": \"${PUSHER}\" },
                  { \"name\": \"Branch\", \"value\": \"${BRANCH}\" },
                  { \"name\": \"Notify\", \"value\": \"cbhanupr_amdeng\" }
                ]
              }],
              \"potentialAction\": [{
                \"@type\": \"OpenUri\",
                \"name\": \"View Changes\",
                \"targets\": [{ \"os\": \"default\", \"uri\": \"${COMPARE}\" }]
              }]
            }"
