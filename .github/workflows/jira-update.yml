# =============================================================================
# Jira Update Trigger Workflow
# =============================================================================
# This lightweight workflow triggers on PR merge events and calls the
# centralized SC Jira update workflow from sc-scripts repository.
#
# Required Secrets (set in your repo or org, inherited automatically):
#   - SSW_CI_JIRA_TOKEN: Jira Personal Access Token
#
# Required Variables (set in your repo settings > Secrets and variables > Variables):
#   - sc_ci_workflow_branches: Comma-separated list of branches to run CI on
# =============================================================================

name: Update Jira on Merge

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Call Centralized SC Jira Update Workflow
  # ---------------------------------------------------------------------------
  update-jira:
    name: SC Jira Update
    if: |
      github.event.pull_request.merged == true &&
      vars.sc_ci_workflow_branches != '' &&
      contains(format(',{0},', vars.sc_ci_workflow_branches), format(',{0},', github.event.pull_request.base.ref))
    uses: AMD-AECG-SSW-PUBLIC/sc-scripts/.github/workflows/sc_jira_update.yml@master
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
