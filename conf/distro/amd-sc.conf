require conf/distro/amd-edf.conf

DISTRO = "amd-sc"
DISTRO_NAME = "AMD System Controller Linux Distribution"
DISTRO_VERSION = "1.0"

# Override chain: poky -> poky-altcfg -> amd-edf -> amd-sc
DISTROOVERRIDES = "poky:poky-altcfg:amd-edf:amd-sc"

# Define the default hostname
hostname:pn-base-files:amd-sc = "amd-sc"

SDK_VENDOR = "-amdscsdk"

TARGET_VENDOR = "-amd"

# ---- Trim features not needed for SC ----
# Remove: multiarch, security, virtualization, tpm, vmsep, xen, polkit, openamp
# Keep: rauc
AMD-EDF_DISTRO_FEATURES:amd-sc = ""
AMD-EDF_DISTRO_FEATURES:amd-sc:append:aarch64 = " rauc"

# Remove mali/GPU features - SC boards don't have GPUs
DISTRO_FEATURES:remove = "libmali"

# SC-specific DISTRO_FEATURES marker
DISTRO_FEATURES:append = " systemcontroller"

# SC doesn't need jupyter
PREFERRED_PROVIDER_start-jupyter = ""

# SC doesn't need stress tools
PREFERRED_PROVIDER_stress = ""
PREFERRED_RPROVIDER_stress = ""

# SC doesn't need wireless
WIRELESS_DAEMON = ""

# SC doesn't need systemd-bootconf-edf
PREFERRED_RPROVIDER_virtual-systemd-bootconf = ""

# ---- SC-specific settings ----

SYSTEM_CONTROLLER_RAUC_DEMO = "yes"
DISTROOVERRIDES .= "${@ ':system-controller-rauc-demo' if bb.utils.to_boolean(d.getVar('SYSTEM_CONTROLLER_RAUC_DEMO'), False) else ''}"

# SC-specific boot script (overrides amd-edf default u-boot-edf-scr)
UBOOT_BOOT_SCRIPT:amd-sc = "u-boot-edf-sc-scr"

# SC uses a single rootfs partition layout (no separate /boot)
WKS_FILES:amd-sc = "system-controller-nobootpartition.wks"

# SC-specific user config (override amd-edf defaults)
EXTRA_USERS_PARAMS = "\
    useradd -p '' amd-sc;passwd-expire amd-sc; \
    usermod -a -G audio,input,video amd-sc; \
"
EXTRA_USERS_SUDOERS = "amd-sc ALL=(ALL) ALL;"

# SC package feed (overrides amd-edf feed)
include conf/distro/include/amd-sc-feed.conf
