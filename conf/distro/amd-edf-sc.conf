require conf/distro/poky-altcfg.conf

DISTRO = "amd-edf-sc"
DISTRO_NAME = "AMD Embedded Development Framework Linux distribution SC build"

AMD-EDF-SC_VERSION = "2026_SC_Q"
AMD-EDF-SC_MINOR = "2"

# Quarterly RPM release version identifier (e.g. 2026_SC_Q2, 2026_SC_Q3, 2026_SC_Q4)
RPM_RELEASE_VERSION ?= "2026_SC_Q2"

# Set to "development" or "release" for release
AMD-EDF-SC_VER_TYPE = "development"

# This will be set in local.conf for CI builds
AMD-EDF-SC_VER_BUILD ?= "${@'${METADATA_REVISION}' if d.getVar('METADATA_REVISION') != '<unknown>' else 'unknown'}"

# Follow the Poky format of <Version>+<type>-<date>
DISTRO_VERSION = "${AMD-EDF-SC_VERSION}${AMD-EDF-SC_MINOR}+${AMD-EDF-SC_VER_TYPE}-${AMD-EDF-SC_VER_BUILD}"

# Override chain: poky -> poky-altcfg -> amd-edf-sc
DISTROOVERRIDES = "poky:poky-altcfg:amd-edf-sc"

# Define the default hostname
hostname:pn-base-files:amd-edf-sc = "amd-edf-sc"

SDK_VENDOR = "-amdedfscsdk"

TARGET_VENDOR = "-amd"

# ---- Distro features for SC ----
# Only rauc is needed for SC on aarch64
DISTRO_FEATURES:append:aarch64 = " rauc"

# SC-specific DISTRO_FEATURES marker
DISTRO_FEATURES:append = " systemcontroller"

# ---- SC-specific settings ----

SYSTEM_CONTROLLER_RAUC_DEMO = "yes"
DISTROOVERRIDES .= "${@ ':system-controller-rauc-demo' if bb.utils.to_boolean(d.getVar('SYSTEM_CONTROLLER_RAUC_DEMO'), False) else ''}"

# SC-specific boot script
UBOOT_BOOT_SCRIPT:amd-edf-sc = "u-boot-edf-sc-scr"

# SC uses a single rootfs partition layout (no separate /boot)
WKS_FILES:amd-edf-sc = "system-controller-nobootpartition.wks"

# ---- Disable Busybox - use full coreutils/net-tools ----
PREFERRED_PROVIDER_base-utils = "packagegroup-core-base-utils"
VIRTUAL-RUNTIME_base-utils = "packagegroup-core-base-utils"
VIRTUAL-RUNTIME_base-utils-hwclock = "util-linux-hwclock"
VIRTUAL-RUNTIME_base-utils-syslog = ""

# ---- License package generation ----
LICENSE_CREATE_PACKAGE = "1"

# ---- User configuration ----
IMAGE_CLASSES += "extrausers"
EXTRA_USERS_PARAMS = "\
    useradd -p '' amd-edf;passwd-expire amd-edf; \
    usermod -a -G audio,input,video amd-edf; \
"
USERADDEXTENSION:append = " amd-useradd-sudoers"
EXTRA_USERS_SUDOERS = "amd-edf ALL=(ALL) ALL;"

# SC package feed
include conf/distro/include/amd-edf-sc-feed.conf
